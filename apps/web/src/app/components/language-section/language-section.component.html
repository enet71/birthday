<ui-settings-section [heading]="'settings.language.title' | transloco" icon="language">
  <ui-settings-row icon="translate" [label]="'settings.language.label' | transloco">
    <mat-form-field uiSettingsRowAction class="field" appearance="outline" subscriptSizing="dynamic">
      <mat-select [aria-label]="'settings.language.label' | transloco" [value]="locale()" (valueChange)="changeLocale($event)">
        @for (option of locales; track option) {
          <mat-option [value]="option" [attr.lang]="option">{{ localeNames[option] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </ui-settings-row>
</ui-settings-section>
