<mat-card appearance="outlined">
  <mat-card-header>
    <h2 mat-card-title>{{ 'settings.language.title' | transloco }}</h2>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field class="field" subscriptSizing="dynamic">
      <mat-label>{{ 'settings.language.label' | transloco }}</mat-label>
      <mat-select [value]="locale()" (valueChange)="changeLocale($event)">
        @for (option of locales; track option) {
          <mat-option [value]="option" [attr.lang]="option">{{ localeNames[option] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-card-content>
</mat-card>
