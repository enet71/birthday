<h2 class="title">Related guides</h2>
<ul class="links">
  @for (guide of guides(); track guide.slug) {
    <li>
      <a [routerLink]="getGuidePath(guide)">{{ guide.title }}</a>
    </li>
  }
  <li><a routerLink="/guides">All guides</a></li>
  <li><a routerLink="/about">About Birthdly and FAQ</a></li>
</ul>
