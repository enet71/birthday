# The production stack on the droplet, in /opt/birthdly. `deploy.sh` runs it; see README.md.
name: birthdly

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  api:
    # `deploy.sh` sets the tags from release.env: the commit SHA each image was built from. The image names are only
    # overridden to test locally.
    image: ${API_IMAGE:-ghcr.io/enet71/birthday-api}:${API_TAG:?API_TAG is not set}
    env_file: .env
    environment:
      NODE_ENV: production
      # Built from POSTGRES_PASSWORD, so .env needs no DATABASE_URL.
      DATABASE_URL: postgresql://birthdly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@postgres:5432/birthdly
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      # Probes every 2 seconds while starting, so `docker compose up --wait` returns soon after the API is ready.
      start_interval: 2s
    logging: *logging

  # Reachable only on the stack's network. The data lives on the postgres_data volume, which deployments and
  # rollbacks never remove.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: birthdly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: birthdly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # Over TCP: while it initialises a new volume, the image runs a temporary server that answers only on the socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U birthdly -d birthdly']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    logging: *logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/enet71/birthday-web}:${WEB_TAG:?WEB_TAG is not set}
    environment:
      NODE_ENV: production
      # Caddy sets these headers; Angular SSR ignores proxy headers it is not told to trust.
      NG_TRUST_PROXY_HEADERS: x-forwarded-for,x-forwarded-host,x-forwarded-proto
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/robots.txt > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
