<ui-settings-section [heading]="'googleCalendar.title' | transloco" icon="calendar_month">
  <div aria-live="polite">
    @switch (view()) {
      @case ('loading') {
        <mat-progress-spinner class="spinner" mode="indeterminate" diameter="32" [attr.aria-label]="'googleCalendar.loading' | transloco" />
      }
      @case ('error') {
        <ui-settings-row icon="error" tone="negative" [description]="'googleCalendar.loadError' | transloco">
          <button uiSettingsRowAction matButton="outlined" type="button" (click)="reloadConnection()">{{ 'common.tryAgain' | transloco }}</button>
        </ui-settings-row>
      }
      @case ('disconnected') {
        <ui-settings-row icon="sync_disabled" [description]="'googleCalendar.description' | transloco">
          <button uiSettingsRowAction matButton="filled" type="button" disabledInteractive [disabled]="isPending()" (click)="connect()">
            {{ 'googleCalendar.connect' | transloco }}
          </button>
        </ui-settings-row>
      }
      @case ('connected') {
        @let syncedAt = lastSyncedAt();
        <ui-settings-row
          icon="check_circle"
          tone="positive"
          [label]="'googleCalendar.connected' | transloco"
          [description]="
            syncedAt
              ? ('googleCalendar.lastSynced' | transloco: { date: (syncedAt | localeDate: 'medium') })
              : ('googleCalendar.notSynced' | transloco)
          "
        >
          <button uiSettingsRowAction matButton="filled" type="button" disabledInteractive [disabled]="isPending()" (click)="syncNow()">
            <mat-icon>sync</mat-icon>
            {{ 'googleCalendar.syncNow' | transloco }}
          </button>
        </ui-settings-row>
        <ui-settings-row icon="link_off" [description]="'googleCalendar.disconnectHint' | transloco">
          <button uiSettingsRowAction matButton="outlined" type="button" disabledInteractive [disabled]="isPending()" (click)="disconnect()">
            {{ 'googleCalendar.disconnect' | transloco }}
          </button>
        </ui-settings-row>
      }
      @case ('revoked') {
        <ui-settings-row
          icon="error"
          tone="negative"
          [label]="'googleCalendar.accessLost' | transloco"
          [description]="'googleCalendar.accessLostText' | transloco"
        >
          <button uiSettingsRowAction matButton="filled" type="button" disabledInteractive [disabled]="isPending()" (click)="connect()">
            {{ 'googleCalendar.reconnect' | transloco }}
          </button>
        </ui-settings-row>
      }
    }
  </div>
</ui-settings-section>
