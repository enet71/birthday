<nav class="items" [attr.aria-label]="'layout.mainNavigation' | transloco">
  @for (item of config.menu; track item.path) {
    <a
      class="item"
      routerLinkActive="item_active"
      [routerLinkActiveOptions]="{ exact: item.path === config.homePath }"
      ariaCurrentWhenActive="page"
      [routerLink]="item.path"
    >
      <span class="item__indicator">
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
      </span>
      <span class="item__label">{{ item.label | transloco }}</span>
    </a>
  }
</nav>
