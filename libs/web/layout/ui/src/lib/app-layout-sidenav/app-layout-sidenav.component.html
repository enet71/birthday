<div class="header">
  <a class="logo" [routerLink]="config.homePath">
    <img class="logo__full" [alt]="config.appName" priority [ngSrc]="config.logo.src" [width]="config.logo.width" [height]="config.logo.height" />
    <img
      class="logo__small"
      [alt]="config.appName"
      [ngSrc]="config.logoSmall.src"
      [width]="config.logoSmall.width"
      [height]="config.logoSmall.height"
    />
  </a>
  <button
    class="toggle"
    matIconButton
    type="button"
    [attr.aria-label]="(isExpanded() ? 'layout.collapseMenu' : 'layout.expandMenu') | transloco"
    [attr.aria-expanded]="isExpanded()"
    (click)="toggle()"
  >
    <mat-icon>{{ isExpanded() ? 'chevron_left' : 'chevron_right' }}</mat-icon>
  </button>
</div>
<mat-nav-list class="items" [attr.aria-label]="'layout.mainNavigation' | transloco">
  @for (item of config.menu; track item.path) {
    <a
      class="item"
      mat-list-item
      routerLinkActive
      [routerLinkActiveOptions]="{ exact: item.path === config.homePath }"
      #link="routerLinkActive"
      ariaCurrentWhenActive="page"
      [routerLink]="item.path"
      [activated]="link.isActive"
      [attr.title]="item.label | transloco"
    >
      <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      <span class="item-label" matListItemTitle>{{ item.label | transloco }}</span>
    </a>
  }
</mat-nav-list>
@if (config.primaryAction; as action) {
  <a class="primary-action" matButton="filled" [routerLink]="action.path" [queryParams]="action.queryParams" [attr.title]="action.label | transloco">
    <mat-icon>{{ action.icon }}</mat-icon>
    <span class="primary-action__label">{{ action.label | transloco }}</span>
  </a>
}
