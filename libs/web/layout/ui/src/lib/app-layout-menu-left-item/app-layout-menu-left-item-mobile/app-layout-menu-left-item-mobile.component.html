<div class="item" (click)="selectItem(item())">
  <mat-icon class="icon">{{ item().icon }}</mat-icon>
  <div class="body">
    <div class="title">
      {{ item().name }}
    </div>
    @if (item().description) {
      <div class="description">{{ item().description }}</div>
    }
  </div>
</div>
@if (menuOpened) {
  <div class="children">
    @for (childItem of item().children; track $index) {
      <div
        class="child"
        [class.selected]="isItemSelected(childItem)"
        (click)="selectItem(childItem)"
      >
        <mat-icon class="icon">{{ childItem.icon }}</mat-icon>
        <div class="child__title">
          {{ childItem.name }}
        </div>
      </div>
    }
  </div>
}
