<button
  class="item"
  type="button"
  [title]="item().name"
  [matMenuTriggerFor]="item().children ? childrenMenu : null"
  (click)="selectItem(item())"
  (menuClosed)="closeMenuItem()"
>
  <mat-icon class="icon">{{ item().icon }}</mat-icon>
  @if (isOpened()) {
    <div class="body">
      <div class="title">
        {{ item().name }}
      </div>
      @if (item().description) {
        <div class="description">{{ item().description }}</div>
      }
    </div>
  }
</button>
<mat-menu #childrenMenu="matMenu" xPosition="after">
  @for (childItem of item().children; track $index) {
    <button
      mat-menu-item
      [class.selected]="isItemSelected(childItem)"
      (click)="selectItem(childItem)"
    >
      <mat-icon>{{ childItem.icon }}</mat-icon>
      <span class="title">{{ childItem.name }}</span>
      @if (childItem.description) {
        <span class="description">{{ childItem.description }}</span>
      }
    </button>
  }
</mat-menu>
