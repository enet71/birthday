<div class="header">
  <button matIconButton aria-label="Close menu" (click)="closeMenu()">
    <mat-icon>close</mat-icon>
  </button>
</div>
<div class="menu">
  <div class="items">
    @for (item of config.menu; track $index) {
      <ui-app-layout-menu-left-item-mobile
        [item]="item"
      ></ui-app-layout-menu-left-item-mobile>
    }
  </div>
</div>
