<div class="body">
  <div class="header">
    <img
      priority
      class="header__logo"
      [ngSrc]="config.logo.src"
      [width]="config.logo.width"
      [height]="config.logo.height"
      (click)="openMainPage()"
    />
    <button matIconButton aria-label="Open menu" (click)="openMenu()">
      <mat-icon>menu</mat-icon>
    </button>
  </div>
  <div class="body__content">
    <ng-content></ng-content>
  </div>
</div>
@if (isMenuOpen()) {
  <ui-app-layout-menu-left-mobile
    (closed)="closeMenu()"
  ></ui-app-layout-menu-left-mobile>
}
