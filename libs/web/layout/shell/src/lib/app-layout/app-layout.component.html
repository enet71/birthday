<ui-app-layout-sidenav class="sidenav" />
<header class="header">
  <div class="content-width">
    <ui-app-layout-top-bar>
      <ng-content select="[uiAppLayoutTopBarEnd]" />
    </ui-app-layout-top-bar>
  </div>
  @if (isLoading()) {
    <mat-progress-bar class="header__progress" mode="indeterminate" [attr.aria-label]="'layout.loading' | transloco"></mat-progress-bar>
  }
</header>
<main class="main">
  <div class="main__scroll">
    <div class="main__content content-width">
      <ng-content />
    </div>
  </div>
</main>
<ui-app-layout-bottom-nav class="bottom-nav" />
