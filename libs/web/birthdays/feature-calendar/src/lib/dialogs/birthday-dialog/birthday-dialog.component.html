<form novalidate (submit)="save($event)">
  <ui-dialog-header>
    <h2 class="title" mat-dialog-title dialog-header="title">{{ isEdit ? 'Edit Birthday' : 'Add Birthday' }}</h2>
    <button matIconButton type="button" aria-label="Close" dialog-header="buttons" mat-dialog-close>
      <mat-icon>close</mat-icon>
    </button>
  </ui-dialog-header>
  <mat-dialog-content class="content">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <mat-icon matPrefix>person</mat-icon>
      <input matInput autocomplete="off" [formField]="birthdayForm.name" />
      @for (error of birthdayForm.name().errors(); track error.kind) {
        <mat-error>{{ error.message }}</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <mat-icon matPrefix>event</mat-icon>
      <input matInput [matDatepicker]="picker" [formField]="birthdayForm.date" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      @for (error of birthdayForm.date().errors(); track error.kind) {
        <mat-error>{{ error.message }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions class="actions" [class.actions_edit]="isEdit">
    @if (isEdit) {
      <button class="actions__delete" matButton type="button" (click)="delete()">
        <mat-icon>delete</mat-icon>
        Delete
      </button>
    }
    <button matButton="outlined" type="button" mat-dialog-close>Cancel</button>
    <button matButton="filled" type="submit">Save</button>
  </mat-dialog-actions>
</form>
