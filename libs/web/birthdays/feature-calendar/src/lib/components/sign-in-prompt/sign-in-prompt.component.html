<div class="message">
  <mat-icon class="message__icon" aria-hidden="true">cloud_upload</mat-icon>
  <p class="message__text">
    <strong class="message__title">{{ 'calendar.signInPromptTitle' | transloco }}</strong>
    {{ 'calendar.signInPromptText' | transloco }}
  </p>
</div>
<button matButton="outlined" type="button" disabledInteractive [disabled]="isSigningIn()" (click)="signInWithGoogle()">
  <img class="google-logo" src="/assets/images/google-logo.svg" alt="" width="18" height="18" />
  {{ 'account.signIn' | transloco }}
</button>
