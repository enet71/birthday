<div class="header">
  <h2 class="header__title">{{ 'calendar.upcoming' | transloco }}</h2>
  <a class="header__link" routerLink="/people">{{ 'calendar.viewAll' | transloco }}</a>
</div>
<div class="body">
  @if (nextBirthdays().length) {
    <ul class="list">
      @for (item of nextBirthdays(); track item.birthday.id) {
        <li [style]="getToneStyles(item.birthday.name)">
          <button class="item" type="button" [class.item_soon]="item.daysUntil <= soonDays" (click)="openEditBirthdayDialog(item)">
            <ui-birthday-avatar class="item__avatar" [name]="item.birthday.name"></ui-birthday-avatar>
            <span class="item__body">
              <span class="item__title">
                <span class="item__name">{{ item.birthday.name }}</span>
                @if ((item.age ?? 0) > 0) {
                  <span class="item__age">{{ 'calendar.turns' | transloco: { age: item.age } }}</span>
                }
              </span>
              <span class="item__date">{{ item.date | localeDate: ('dates.monthDay' | transloco) }} · {{ getDaysUntilLabel(item.daysUntil) }}</span>
            </span>
            <mat-icon class="item__chevron" aria-hidden="true">chevron_right</mat-icon>
          </button>
        </li>
      }
    </ul>
  } @else if (!isLoading()) {
    <div class="welcome">
      <h3 class="welcome__title">{{ 'calendar.welcomeTitle' | transloco }}</h3>
      <p class="welcome__text">
        {{ 'calendar.welcomeText' | transloco }}
      </p>
      <button matButton="filled" type="button" (click)="openAddBirthdayDialog()">
        <mat-icon>add</mat-icon>
        {{ 'calendar.addBirthday' | transloco }}
      </button>
    </div>
  }
</div>
