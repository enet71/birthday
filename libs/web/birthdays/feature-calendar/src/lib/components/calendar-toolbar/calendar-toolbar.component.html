<div class="navigation">
  <button
    matIconButton
    type="button"
    [attr.aria-label]="isYearView() ? 'Previous year' : 'Previous month'"
    (click)="showPrevious()"
  >
    <mat-icon>chevron_left</mat-icon>
  </button>
  <h2 class="title" aria-live="polite">
    {{ viewMonth() | date: (isYearView() ? 'y' : 'MMMM y') }}
  </h2>
  <button
    matIconButton
    type="button"
    [attr.aria-label]="isYearView() ? 'Next year' : 'Next month'"
    (click)="showNext()"
  >
    <mat-icon>chevron_right</mat-icon>
  </button>
  <button class="today" matButton="outlined" type="button" (click)="showToday()">
    Today
  </button>
</div>
<mat-button-toggle-group
  aria-label="Calendar view"
  hideSingleSelectionIndicator
  [value]="view()"
  (change)="setView($event)"
>
  <mat-button-toggle value="month">Month</mat-button-toggle>
  <mat-button-toggle value="year">Year</mat-button-toggle>
</mat-button-toggle-group>
