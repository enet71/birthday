<section class="card calendar" aria-label="Calendar" [attr.aria-busy]="isLoading()">
  @if (isLoading()) {
    <mat-progress-bar class="calendar__progress" mode="indeterminate" aria-label="Loading birthdays"></mat-progress-bar>
  }
  <ui-calendar-toolbar></ui-calendar-toolbar>
  @if (view() === 'year') {
    <ui-calendar-year></ui-calendar-year>
  } @else {
    <ui-calendar-month class="calendar__month"></ui-calendar-month>
  }
</section>
<aside class="next-birthdays" aria-label="Upcoming birthdays">
  <ui-next-birthdays></ui-next-birthdays>
</aside>
<div class="fab">
  <button matFab type="button" aria-label="Add birthday" (click)="openAddBirthdayDialog()">
    <mat-icon>add</mat-icon>
  </button>
</div>
