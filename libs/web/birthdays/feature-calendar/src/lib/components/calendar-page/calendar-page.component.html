<section class="calendar" [attr.aria-label]="'calendar.label' | transloco" [attr.aria-busy]="isLoading()">
  @if (isLoading()) {
    <mat-progress-bar class="calendar__progress" mode="indeterminate" [attr.aria-label]="'calendar.loadingBirthdays' | transloco"></mat-progress-bar>
  }
  <ui-calendar-toolbar></ui-calendar-toolbar>
  @if (view() === 'year') {
    <ui-calendar-year></ui-calendar-year>
  } @else {
    <ui-calendar-month class="calendar__month"></ui-calendar-month>
  }
</section>
<aside class="next-birthdays" [attr.aria-label]="'calendar.upcomingBirthdays' | transloco">
  <ui-next-birthdays class="next-birthdays__content"></ui-next-birthdays>
  <div class="next-birthdays__bottom">
    @if (isSignInPromptVisible()) {
      <ui-sign-in-prompt></ui-sign-in-prompt>
    }
    <!-- Google OAuth branding requires the app name and the legal links on the home page. -->
    <footer class="next-birthdays__footer">
      <ui-app-layout-footer></ui-app-layout-footer>
    </footer>
  </div>
</aside>
<div class="fab">
  <button matFab type="button" [attr.aria-label]="'calendar.addBirthday' | transloco" (click)="openAddBirthdayDialog()">
    <mat-icon>add</mat-icon>
  </button>
</div>
