<div class="weekdays" aria-hidden="true">
  @for (weekday of weekdays(); track $index) {
    <div class="weekday">
      <span class="weekday__full">{{ weekday | date: 'EEE' }}</span>
      <span class="weekday__short">{{ weekday | date: 'EEEEE' }}</span>
    </div>
  }
</div>
<div class="days">
  @for (day of days(); track day.date.getTime()) {
    <div class="day" [class.day_outside]="!day.isCurrentMonth" [class.day_today]="day.isToday" [class.day_birthday]="day.birthdays.length">
      <!-- Covers the whole cell; birthday buttons sit on top of it, because buttons cannot be nested. -->
      <button
        class="day__select"
        type="button"
        [attr.aria-label]="getDayLabel(day)"
        [attr.aria-current]="day.isToday ? 'date' : null"
        (click)="openAddBirthdayDialog(day.date)"
      >
        <mat-icon class="day__add" aria-hidden="true">add</mat-icon>
      </button>
      <span class="day__number" aria-hidden="true">{{ day.date | date: 'd' }}</span>
      @if (day.birthdays.length) {
        <span class="day__birthdays">
          @for (birthday of day.birthdays; track birthday.id) {
            <button
              class="day__birthday"
              type="button"
              [attr.aria-label]="'Edit birthday of ' + birthday.name"
              (click)="openEditBirthdayDialog(birthday)"
            >
              <ui-birthday-chip [name]="birthday.name" [age]="getAge(birthday, day.date)"></ui-birthday-chip>
            </button>
          }
        </span>
        <span class="day__dot"></span>
      }
    </div>
  }
</div>
