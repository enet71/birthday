<svg width="100%" height="100%" viewBox="0 0 100 100" class="donut">
  <circle class="donut__center" cx="50" cy="50" [attr.r]="radius"></circle>
  <circle
    class="donut__border"
    cx="50"
    cy="50"
    fill="transparent"
    [attr.r]="radius - 5"
    [attr.stroke-width]="strokeWidth"
  ></circle>
  <circle
    cx="50"
    cy="50"
    fill="transparent"
    [attr.stroke]="range().background"
    [attr.r]="radius"
    [attr.stroke-width]="strokeWidth"
  ></circle>
  <circle
    #donutFillElement
    class="donut__fill"
    cx="50"
    cy="50"
    fill="transparent"
    [attr.stroke]="range().fill"
    [attr.stroke-width]="strokeWidth"
    [attr.r]="radius"
    [attr.stroke-dasharray]="dasharray()"
    [attr.stroke-dashoffset]="dashoffset"
  ></circle>
  <text x="50%" y="50%" class="donut__value">
    {{ percent() }}
  </text>
  <foreignObject width="100" height="100">
    <ng-content></ng-content>
  </foreignObject>
</svg>
