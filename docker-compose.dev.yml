# Local development services: `docker compose -f docker-compose.dev.yml up -d`.
name: birthdly-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: birthdly
      POSTGRES_PASSWORD: birthdly
      POSTGRES_DB: birthdly
    ports:
      # This machine only: the password is in the repository.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U birthdly -d birthdly']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
